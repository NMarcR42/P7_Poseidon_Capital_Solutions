<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-4 shadow" style="width: 300px;">
    <h5 class="card-title text-center mb-4">Login with Username and Password</h5>

    <form th:action="@{/app/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">User:</label>
            <input type="text" id="username" name="username" class="form-control">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" name="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <div th:if="${param.error}" class="alert alert-danger mt-3" role="alert">
        Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="alert alert-success mt-3" role="alert">
        You have been logged out.
    </div>
</div>

</body>
</html>
